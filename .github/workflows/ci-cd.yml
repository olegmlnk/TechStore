name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/tech-store-client/package-lock.json

      - name: Frontend CI
        working-directory: client/tech-store-client
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run build

      # Lab 6: ship readable stack traces. Needs the SENTRY_AUTH_TOKEN secret;
      # use an Organization Auth Token (sntrys_...) so sentry-cli auto-targets
      # the right Sentry region (this project is on EU / de.sentry.io).
      # continue-on-error keeps CI green until the token is configured.
      - name: Upload source maps to Sentry
        if: github.ref == 'refs/heads/main'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        continue-on-error: true
        run: |
          cd client/tech-store-client
          npx sentry-cli sourcemaps inject ./dist/tech-store-client/browser
          npx sentry-cli sourcemaps upload --org olegmelnyk --project techstore ./dist/tech-store-client/browser

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/tech-store-client/dist/tech-store-client

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Backend CI
        working-directory: server/TechStore
        run: |
          dotnet restore TechStore.sln
          dotnet build TechStore.sln --configuration Release --no-restore
          dotnet publish TechStore.API/TechStore.API.csproj --configuration Release --no-build --output ./publish/TechStore.API

      - uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: server/TechStore/publish/TechStore.API

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      FRONTEND_API_URL: ${{ secrets.FRONTEND_API_URL }}
      # Add these in GitHub -> Settings -> Secrets and variables -> Actions:
      #   POSTHOG_KEY  = phc_... (project key, same as src/environments/environment.production.ts)
      #   POSTHOG_HOST = https://us.i.posthog.com
      #   SENTRY_DSN   = https://...ingest.us.sentry.io/... (optional; empty disables Sentry)
      POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
      POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID FRONTEND_API_URL POSTHOG_KEY POSTHOG_HOST; do
            [ -n "${!name}" ] || { echo "Missing secret: $name"; exit 1; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/tech-store-client/package-lock.json

      - name: Deploy frontend to Vercel
        working-directory: client/tech-store-client
        shell: bash
        run: |
          npm ci
          cat <<EOF > src/environments/environment.production.ts
          export const environment = {
            production: true,
            apiUrl: '${FRONTEND_API_URL}',
            appStatus: 'Production Mode',
            posthogKey: '${POSTHOG_KEY}',
            posthogHost: '${POSTHOG_HOST}',
            sentryDsn: '${SENTRY_DSN}',
          };
          EOF
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
