<section class="order-confirmation">
  <div class="confirmation-card" data-testid="order-confirmation-card">
    <div class="badge">✓</div>
    <h1>Дякуємо за замовлення!</h1>
    <p class="message">Ми отримали ваш запит. Підтвердження надіслано на вашу пошту.</p>
    <div class="order-id">
      <span class="label">Order ID</span>
      <code data-testid="order-id">{{ orderId }}</code>
    </div>
    <a class="primary-btn" routerLink="/">Continue shopping</a>
  </div>
</section>
